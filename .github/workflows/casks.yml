name: casks
on:
  push:
    paths: ["Casks/**", ".github/workflows/casks.yml"]
  pull_request:
    paths: ["Casks/**", ".github/workflows/casks.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Style and audit published casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          if [ -f Casks/jaywalk.rb ]; then
            tap="$(brew --repository)/Library/Taps/sorahn/homebrew-tap"
            mkdir -p "$(dirname "$tap")"
            ln -s "$GITHUB_WORKSPACE" "$tap"
            brew style --cask sorahn/tap/jaywalk
            brew audit --cask --online sorahn/tap/jaywalk
          fi
